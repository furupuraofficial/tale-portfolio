name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Go backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install --yes portaudio19-dev
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run tests
        run: go test ./...

  admin-web:
    name: Admin web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  ios:
    name: iOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build without code signing
        working-directory: apps/ios
        run: >-
          xcodebuild
          -project TALE.xcodeproj
          -scheme TALE
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/tale-derived-data"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Run iOS unit tests
        working-directory: apps/ios
        shell: bash
        run: |
          SIMULATOR_ID=$(
            xcrun simctl list devices available -j |
            python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in sorted(devices, reverse=True) if "iOS" in runtime for device in devices[runtime] if device.get("isAvailable")))'
          )
          xcodebuild test \
            -project TALE.xcodeproj \
            -scheme TALE \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -only-testing:TALETests
