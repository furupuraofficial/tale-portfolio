version: 2
updates:
  - package-ecosystem: gomod
    directory: /services/api
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/admin-web
    schedule:
      interval: weekly
    groups:
      admin-web-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
